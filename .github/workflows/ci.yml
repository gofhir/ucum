name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release go.mod allows, the current one, and the tip of
        # development. A library is used by whatever toolchain its consumers have.
        go: ["1.24", "1.25", "stable"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.go == env.GO_VERSION
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
        continue-on-error: true

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # A short run per target. The point is not to find something new in 30
      # seconds — the long runs happen locally — but to keep the targets
      # compiling and to replay the corpus checked into testdata, which is where
      # a previously found crash lives.
      - name: Fuzz the parser
        run: go test -run XXX -fuzz FuzzValidate -fuzztime 30s ./internal/engine/

      - name: Fuzz the compose round trip
        run: go test -run XXX -fuzz FuzzComposeRoundTrip -fuzztime 30s ./internal/engine/

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # There are no dependencies to audit, so what this checks is the standard
      # library and the toolchain: a vulnerability in encoding/xml or math/big
      # reaches this package like any other.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify module
        run: go mod verify

      - name: Check zero dependencies
        run: |
          DEPS=$(go list -m all | wc -l)
          if [ "$DEPS" -ne 1 ]; then
            echo "Expected 0 external dependencies, found $((DEPS-1))"
            go list -m all
            exit 1
          fi

      # The public API is the contract. This does not gate the build — an
      # intentional addition is normal — but it prints what changed so that a
      # reviewer sees an accidental export before it ships.
      - name: Report the public API
        run: |
          go doc -all . | grep -E '^(func|type|var|const) ' | sort
          go doc -all ./fhir | grep -E '^(func|type|var|const) ' | sort
